# QMC-YOLOMG small model: registration-quality + motion-contribution fusion
# Structure identical to models/NPS_uav_s.yaml; layer 4 is the QMCFusion block
# (models/common.py) which consumes the 3-channel quality evidence Q produced
# by utils/quality.py and performs residual appearance-preserving fusion.

# Parameters
nc: 1  # number of classes
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.5  # layer channel multiple
backbone1depth: 2  # number of light-branch layers (RGB appearance stream)
motion_dropout: 0.0  # legacy full-image dropout; train.py applies it explicitly
# Anchors in pixels per stride level (P2-P5), sized for tiny UAV targets.
# AutoAnchor (train.py, enabled by default) may re-cluster them per dataset.
anchors:
  - [5, 5,  8, 8,  12, 12,  18, 18]     # P2/2
  - [8, 8,  14, 14, 20, 20,  30, 30]     # P3/4
  - [12, 12, 20, 20, 32, 32,  48, 48]    # P4/8
  - [16, 16, 28, 28, 44, 44,  64, 64]    # P5/16

backbone1:
  # [from, number, module, args]
  [[-1, 1, Conv, [8, 3, 1, 1]],  #0 -P1/2
   [-1, 3, C3, [8]], #1 640*640*8
  ]

backbone2:
  # [from, number, module, args]
  [[-1, 1, Conv, [8, 3, 1, 1]],  #2 0-P1/2
   [-1, 3, C3, [8]], #3 640*640*8
   [[-1, 1], 1, QMCFusion, [16, 1]],  #4 quality-evidence residual fusion
   [-1, 3, C3, [32]], #5 640*640*32

   [-1, 1, Conv, [64, 3, 2]],  #6 320*320*64
   [-1, 3, C3, [64]], #7 320*320*64

   [-1, 1, Conv, [128, 3, 2]], #8 160*160*128
   [-1, 3, C3, [128]], #9 160*160*128

   [ -1, 1, Conv, [256, 3, 2 ] ], #10 80*80*256
   [ -1, 3, C3, [256]], #11 80*80*256

   [-1, 1, Conv, [512, 3, 2]], #12 40*40*512
   [-1, 9, C3, [512]], #13 40*40*512
   [-1, 1, SPPF, [512, 5]],  #14 40*40*512
  ]

# YOLOv5 v6.0 head
head:
  [[-1, 1, Conv, [256, 1, 1]], #15 40*40*256
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  #16 80*80*256
   [[-1, 11], 1, Concat, [1]],  #17 cat backbone P4 80*80*512
   [-1, 3, C3, [256, False]],  # 18 80*80*256

   [-1, 1, Conv, [128, 1, 1]], #19 80*80*128
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  #20 160*160*128
   [[-1, 9], 1, Concat, [1]],  #21 cat backbone P3 160*160*256
   [-1, 3, C3, [128, False]],  # 22 160*160*128

   [-1, 1, Conv, [64, 1, 1]], #23 160*160*64
   [-1, 1, nn.Upsample, [None, 2, 'nearest']],  #24 320*320*64
   [[-1, 7], 1, Concat, [1]],  #25 cat backbone P2 320*320*128

   [-1, 3, C3, [64, False]],  # 26 320*320*64

   [ -1, 1, Conv, [64, 3, 2]],  # 27 160*160*64
   [ [ -1, 23], 1, Concat, [1]],  # 28 cat head P4 160*160*128
   [ -1, 3, C3, [128, False]],  # 29 160*160*128

   [-1, 1, Conv, [128, 3, 2]], #30 80*80*128
   [[-1, 19], 1, Concat, [1]],  #31 cat head P5 80*80*256
   [-1, 3, C3, [256, False]],  #32 (P5/32-large) 80*80*256

   [-1, 1, Conv, [256, 3, 2]], #33 40*40*256
   [[-1, 15], 1, Concat, [1]],  #34 cat head P5 40*40*512
   [ -1, 3, C3, [512, False]] ,  #35 (P5/32-large) 40*40*512

   [[26, 29, 32, 35], 1, Detect, [nc, anchors]],  # Detect(P2, P3, P4, P5)
  ]
